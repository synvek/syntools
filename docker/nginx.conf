# Full nginx config for the SynTools static build (copied to /etc/nginx/nginx.conf).

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens  off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile         on;
    tcp_nopush       on;
    keepalive_timeout  65;

    gzip             on;
    gzip_vary        on;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        application/xml+rss
        image/svg+xml;

    # Hashed Vite assets are immutable; prerendered HTML / sitemap must be
    # revalidated so a new deploy is visible immediately.
    map $uri $cache_control {
        ~^/assets/   "public, max-age=31536000, immutable";
        default      "no-cache";
    }

    server {
        listen       80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Same policy as vercel.json / public/_headers: same-origin only,
        # no third-party scripts, wasm allowed for in-tree formatters.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; connect-src 'self' data: blob:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $cache_control always;

        # Cloudflare Pages / Netlify-only files copied from public/
        location = /_headers   { deny all; }
        location = /_redirects { deny all; }

        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Prerendered pages are <path>/index.html (en + zh trees); anything else
        # falls back to the SPA shell so deep links keep working.
        location / {
            try_files $uri $uri/index.html /index.html;
        }
    }
}
