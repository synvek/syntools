name: Deploy to Cloudflare Pages

# Why not drag-and-drop upload in the web UI: the Direct Upload drag channel only ships static
# assets and never compiles the repo's functions/ directory — so /api/event 404s, the front end
# fires the beacon but the static host rejects it with 405, and sendBeacon stays silent throughout.
#
# This workflow deploys with `wrangler pages deploy`, which picks up ./functions automatically.
#
# Manual trigger only by default, so a push never ships straight to production. Loosen it to push
# once the pipeline has proven stable.
on:
  workflow_dispatch:
    inputs:
      branch_commit:
        description: 'Mark this deployment as a preview (does not update the production domain)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build:cf = FFMPEG_PAGES=1 VITE_ANALYTICS_ENDPOINT=/api/event pnpm build
      # Must use this script, not plain pnpm build: otherwise the front end gets no analytics
      # endpoint and the whole telemetry chain fails silently.
      - name: Build
        run: pnpm build:cf
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler@latest pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch="$DEPLOY_BRANCH" \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Set in repo Settings → Variables; the value is the Pages project name
          CF_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          # main = update the production domain; any other branch name = preview deployment only
          DEPLOY_BRANCH: ${{ inputs.branch_commit && 'preview' || 'main' }}

      # Self-check right after deploy: with Functions live, GET must return 405 (with allow: POST).
      # A 404 means functions/ was left out again and the build was pointless.
      - name: Verify Functions deployed
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://www.syntools.net/api/event")
          echo "GET /api/event -> $CODE"
          if [ "$CODE" != "405" ]; then
            echo "::error::Functions are not live (expected 405, got $CODE). Check whether functions/ is included in the deployment."
            exit 1
          fi
