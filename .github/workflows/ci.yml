name: CI

# 版本管理（简化双通道，全部由 workflow_dispatch 触发）：
#   release 模式：tag = v<version>.<run_number>，构建版本 = <version>-<run_number>（合法 semver）
#                 run_number 单调递增、永不复用 → 每次都是新 tag，不会覆盖历史。
#   dev     模式：tag = v<version>.dev，构建版本 = <version>-dev
#                 一个 version 共用一个 dev tag，允许覆盖重发（删旧 Release + 强制移动 tag）。
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'release: 正式发布（tag v<version>.<run>）；dev: 开发构建（tag v<version>.dev.<run>）'
        type: choice
        options:
          - dev
          - release
        default: dev

# 创建并推送 tag、发布 Release 需要写权限
permissions:
  contents: write

jobs:
  # 解析本次构建的版本 / 通道 / tag
  version:
    name: resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      base: ${{ steps.resolve.outputs.base }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: resolve
        run: |
          BASE="$(jq -r '.version' package.json)"
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            echo "::error::package.json 中缺少 version 字段"; exit 1
          fi

          RUN="${{ github.run_number }}"
          CHANNEL="${{ github.event.inputs.channel || 'dev' }}"

          if [ "$CHANNEL" = "release" ]; then
            # tag 用四点式（任意字符串）；构建版本需合法 semver，用 pre-release 形式
            BUILD="${BASE}-${RUN}"
            TAG="v${BASE}.${RUN}"
          else
            CHANNEL="dev"
            # dev 不携带 run_number：一个 version 共用一个 dev tag，允许覆盖重发
            BUILD="${BASE}-dev"
            TAG="v${BASE}.dev"
          fi

          if ! echo "$BUILD" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::非法版本号：$BUILD"; exit 1
          fi

          echo "version=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved -> build=${BUILD} tag=${TAG} channel=${CHANNEL}"

  ci:
    name: lint + typecheck + test + build + e2e
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code linting (ESLint)
        run: pnpm lint

      - name: Type checking
        run: pnpm typecheck

      # 以 package.json 为来源把版本同步进 Cargo / tauri.conf（写模式，避免漂移导致构建失败）
      - name: Sync version (package.json -> Cargo / tauri.conf)
        run: pnpm version:sync

      - name: Unit tests (with coverage)
        run: pnpm test -- --coverage

      - name: Build
        run: pnpm build

      - name: Size budget check
        run: pnpm size

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: dist/size-report.md
          retention-days: 30

  tauri:
    name: tauri (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      # vite build 在 macOS runner 上会顶到 Node 默认堆上限（heap OOM），统一提高子进程堆上限
      NODE_OPTIONS: --max-old-space-size=8192
      # 注入本次构建版本，让安装包携带唯一/正式版本号
      SYNTOOLS_BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tauri-${{ matrix.name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      # 将本次构建版本（release: <v>-<run>；dev: <v>-dev.<run>）写入 Cargo / tauri.conf
      - name: Sync build version (Cargo / tauri.conf)
        run: pnpm version:sync

      - name: Tauri build
        run: pnpm tauri:build

      # 只保留安装包，排除 .app、辅助脚本等
      - name: Stage installers
        shell: bash
        run: |
          mkdir -p installers
          find src-tauri/target/release/bundle -type f \( \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) -print -exec cp -f {} installers/ \;
          echo "Staged installers:"
          ls -la installers
          test -n "$(ls -A installers)"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish (${{ needs.version.outputs.channel }})
    runs-on: ubuntu-latest
    needs: [ci, tauri, version]
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 下载后结构：artifacts/tauri-<platform>/<installer>
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tauri-*
          merge-multiple: false

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Prepare release notes
        id: notes
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          BUILD="${{ needs.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk '/^## \['"${BUILD}"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md || true
          fi
          if [ ! -s release_notes.md ]; then
            echo "Build **${BUILD}** (tag ${TAG}, channel: ${{ needs.version.outputs.channel }})" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
          echo "Release notes:" && cat release_notes.md

      # release 通道：run_number 唯一 → 新建并推送 tag（不会覆盖历史）
      - name: Create and push tag (release channel)
        if: needs.version.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # dev 通道：一个 version 共用一个 dev tag，删除旧 Release 并强制移动 tag 以覆盖重发
      - name: Reset dev tag (dev channel, overwrite)
        if: needs.version.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 删除旧 Release（若存在），tag 随后强制指向当前提交
          gh release delete "$TAG" --yes || true
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.version.outputs.channel == 'dev' }}
          files: artifacts/tauri-*/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
