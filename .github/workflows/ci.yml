name: CI

# Versioning (simplified two-channel scheme, everything triggered by workflow_dispatch):
#   release mode: tag = v<version>.<run_number>, build version = <version>-<run_number> (valid semver)
#                 run_number only ever increases and is never reused -> every tag is new, history is never overwritten.
#   dev     mode: tag = v<version>.dev, build version = <version>-0 (MSI/WiX requires a numeric pre-release)
#                 one dev tag per version; re-releasing over it is allowed (delete the old Release + force-move the tag).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'release: production release (tag v<version>.<run>); dev: development build (tag v<version>.dev.<run>)'
        type: choice
        options:
          - dev
          - release
        default: dev

# Creating and pushing tags plus publishing Releases requires write access
permissions:
  contents: write

jobs:
  # Resolve the version / channel / tag for this build
  version:
    name: resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      base: ${{ steps.resolve.outputs.base }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: resolve
        run: |
          BASE="$(jq -r '.version' package.json)"
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            echo "::error::package.json has no version field"; exit 1
          fi

          RUN="${{ github.run_number }}"
          CHANNEL="${{ github.event.inputs.channel || 'dev' }}"

          if [ "$CHANNEL" = "release" ]; then
            # Tags use a four-part form (any string); the build version must be valid semver, so use a pre-release
            BUILD="${BASE}-${RUN}"
            TAG="v${BASE}.${RUN}"
          else
            CHANNEL="dev"
            # dev carries no run_number: one dev tag per version, re-releases may overwrite it.
            # Note: MSI (WiX) requires the pre-release identifier to be purely numeric and <=65535,
            # so dev builds use a numeric pre-release (0.7.0-0) while the tag stays v0.7.0.dev.
            BUILD="${BASE}-0"
            TAG="v${BASE}.dev"
          fi

          if ! echo "$BUILD" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version: $BUILD"; exit 1
          fi

          echo "version=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved -> build=${BUILD} tag=${TAG} channel=${CHANNEL}"

  # Dependency license gate (npm + Rust). Its own job: it must not block the 6-platform desktop
  # build matrix, and its failures stay obvious at a glance - license issues come before packaging.
  licenses:
    name: license gate (npm + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: License gate (npm, prod + dev)
        run: pnpm license:check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: cargo-deny

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # cargo-deny only resolves the dependency graph, no compilation; allowlist lives in src-tauri/deny.toml
      - name: License gate (Rust, cargo-deny)
        run: pnpm license:check:rust

  ci:
    name: lint + typecheck + test + build + e2e
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      # License gate: any strong-copyleft component (GPL / AGPL / SSPL ...) fails the build immediately.
      # It must run before the build - once a component ships, cleaning it up costs far more than blocking it.
      - name: License gate (npm)
        run: pnpm license:check

      - name: Code linting (ESLint)
        run: pnpm lint

      - name: Type checking
        run: pnpm typecheck

      # Sync the version from package.json into Cargo / tauri.conf (write mode, so drift can't break the build)
      - name: Sync version (package.json -> Cargo / tauri.conf)
        run: pnpm version:sync

      - name: Unit tests (with coverage)
        run: pnpm test -- --coverage

      # Round-trip baseline (plan §5.2): generated OOXML samples → import → metrics → export.
      # Non-blocking on purpose: the drift report is reviewed by a human, and a known degradation
      # must not stop a release. Regenerate the golden locally with `pnpm baseline:roundtrip --update`.
      - name: OOXML round-trip baseline (non-blocking)
        continue-on-error: true
        run: pnpm baseline:roundtrip

      - name: Upload baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ooxml-baseline-report
          path: fixtures/ooxml-baseline/report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Build
        run: pnpm build

      - name: Size budget check
        run: pnpm size

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: dist/size-report.md
          retention-days: 30

  tauri:
    name: tauri (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-x64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      # vite build hits Node's default heap ceiling on the macOS runner (heap OOM); raise the child heap limit
      NODE_OPTIONS: --max-old-space-size=8192
      # Inject this build's version so installers carry a unique/official version number
      SYNTOOLS_BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tauri-${{ matrix.name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      # Write this build's version (release: <v>-<run>; dev: <v>-dev.<run>) into Cargo / tauri.conf
      - name: Sync build version (Cargo / tauri.conf)
        run: pnpm version:sync

      - name: Tauri build
        run: pnpm tauri:build

      # Keep installers only; drop .app bundles, helper scripts and the like
      - name: Stage installers
        shell: bash
        run: |
          mkdir -p installers
          find src-tauri/target/release/bundle -type f \( \
            -name '*.dmg' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' \
          \) -print -exec cp -f {} installers/ \;
          echo "Staged installers:"
          ls -la installers
          test -n "$(ls -A installers)"

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish (${{ needs.version.outputs.channel }})
    runs-on: ubuntu-latest
    # Temporarily relaxed: publish no longer depends on ci (lint + typecheck + test + e2e),
    # only on the tauri desktop packages, version resolution and licenses (the license gate).
    # Artifacts with an unacceptable license may never ship, so licenses must stay a dependency.
    needs: [tauri, version, licenses]
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Layout after download: artifacts/tauri-<platform>/<installer>
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tauri-*
          merge-multiple: false

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Prepare release notes
        id: notes
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          BUILD="${{ needs.version.outputs.version }}"
          if [ -f CHANGELOG.md ]; then
            awk '/^## \['"${BUILD}"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md || true
          fi
          if [ ! -s release_notes.md ]; then
            echo "Build **${BUILD}** (tag ${TAG}, channel: ${{ needs.version.outputs.channel }})" > release_notes.md
            echo "" >> release_notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> release_notes.md
          fi
          echo "Release notes:" && cat release_notes.md

      # release channel: run_number is unique -> create and push a new tag (history is never overwritten)
      - name: Create and push tag (release channel)
        if: needs.version.outputs.channel == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      # dev channel: one dev tag per version - delete the old Release and force-move the tag to re-release
      - name: Reset dev tag (dev channel, overwrite)
        if: needs.version.outputs.channel == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Delete the old Release (if any), then force the tag onto the current commit
          gh release delete "$TAG" --yes || true
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.version.outputs.channel == 'dev' }}
          files: artifacts/tauri-*/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
