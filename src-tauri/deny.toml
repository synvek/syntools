# cargo-deny configuration (dependency gate for the Rust side)
#
# Only the licenses check is enabled: any license outside the allowlist fails, so
# strong copyleft components such as GPL / AGPL / SSPL cannot get in. This matches
# what `pnpm license:check` enforces for npm, keeping the dual release
# (AGPL community edition + commercial license) viable (see plan/license-audit.md).
#
# Scope: third-party crates only. This crate itself is AGPL-3.0-only -- the project's
# own license -- so it is excluded from the check through `private.ignore` below
# instead of by adding AGPL to the allowlist.
#
# Local: pnpm license:check:rust (requires cargo install cargo-deny first)
# CI: the licenses job in .github/workflows/ci.yml
#
# Rule: when CI reports a license missing from allow, the order of work is
# "replace/remove the dependency → review the license → only then consider adding
# it to the allowlist". Never widen the allowlist just to pass the gate.

[licenses]
# Configuration version for cargo-deny 0.14+
version = 2

# Minimum confidence required for declarative license matching: below this the
# license counts as undeterminable and fails, instead of guessing a permissive one.
confidence-threshold = 0.85

# This crate itself is AGPL-3.0-only (the project's own license), which the allowlist below
# deliberately does not contain. `private.ignore` skips license checking for unpublished
# workspace members, so the gate keeps looking only at third-party code -- the whole point of
# the check. Requires `publish = false` in Cargo.toml; do not reuse it to smuggle a GPL crate in.
private = { ignore = true }

# Allowlist: all permissive licenses, file-level copyleft, or public-domain statements.
# Compound expressions (e.g. `MIT OR Apache-2.0`) are parsed as SPDX by cargo-deny; matching either side passes.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BlueOak-1.0.0",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CC-BY-4.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# Warn about allowlist entries that stay unused, so the list can be trimmed periodically
unused-allowed-license = "warn"

[sources]
# crates.io only: git dependencies or private registries need an explicit entry,
# so the supply chain cannot be quietly rerouted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
