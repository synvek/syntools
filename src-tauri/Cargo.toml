[package]
name = "syntools"
version = "0.9.0"
description = "SynTools — privacy-first developer toolbox"
authors = ["synvek"]
license = "AGPL-3.0-only"
repository = "https://github.com/synvek/syntools"
edition = "2021"
rust-version = "1.77.2"
# Desktop app crate, never published to crates.io. Also the signal cargo-deny uses to treat this
# package as first-party code instead of a third-party dependency (see deny.toml).
publish = false

[lib]
name = "syntools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
