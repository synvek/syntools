<!doctype html>
<!--
  The default tree is English (no path prefix = en); the Chinese tree lives under /zh/.
  `lang` / `title` / `description` here are only fallbacks: at the end of the build
  scripts/prerender.ts rewrites them per language and injects hreflang into both trees.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <title>SynTools - Online Toolkit</title>
    <meta
      name="description"
      content="SynTools is a free online toolkit that runs entirely in your browser: JSON, Base64, regex, hashing, PDF, images and Office documents, with no uploads."
    />
    <!-- Baidu Search Resource Platform site verification: must not be removed once verified; Baidu re-checks it periodically -->
    <meta name="baidu-site-verification" content="codeva-tIYOjt3A6N" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
